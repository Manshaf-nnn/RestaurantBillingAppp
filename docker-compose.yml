# ============================================================================
# RestaurantOS — production-ish local stack: app + Postgres + Redis.
#   docker compose up -d
#   docker compose exec app npm run setup   # generate, migrate, seed
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurantos
      POSTGRES_PASSWORD: restaurantos
      POSTGRES_DB: restaurantos
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restaurantos']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://restaurantos:restaurantos@db:5432/restaurantos?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-dev-access-secret-change-me-please-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-dev-refresh-secret-change-me-please-32chars}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3000}
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  db_data:
  redis_data:
