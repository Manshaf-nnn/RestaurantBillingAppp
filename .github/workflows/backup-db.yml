# ============================================================================
# Every night, a copy of the production database that does not live at Neon.
#
# ── Why, when Neon already keeps history ────────────────────────────────────
#
# Neon's point-in-time recovery is the first line: it can undo a bad hour.
# It is also inside the same account, on the same plan, behind the same
# card. On 2026-09-27 that account refused every connection over a quota,
# and the data — intact — was unreachable for the rest of the evening. A
# copy that lives somewhere else is what "never lose the data" actually
# means, and it must exist BEFORE the day it is needed.
#
# ── What this does ──────────────────────────────────────────────────────────
#
#   1. pg_dump over DIRECT_URL (the un-pooled connection the deploy already
#      carries), with a Postgres client at least as new as the server.
#   2. Restore it into a throwaway Postgres on the runner and count the
#      tables and restaurants, so a dump that would not restore fails HERE,
#      tonight, not on the morning it is needed.
#   3. Encrypt it with BACKUP_PASSPHRASE and keep it as a workflow artifact
#      for 30 days. This repository is public: an unencrypted artifact would
#      be the whole customer database, downloadable by anyone signed in to
#      GitHub. So without the passphrase the job refuses, rather than
#      uploading in the clear "just this once".
#
# ── To restore ──────────────────────────────────────────────────────────────
#
#   Download the artifact from the run, then:
#     openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 \
#       -pass pass:'<BACKUP_PASSPHRASE>' -in tableflow-*.sql.gz.enc | gunzip \
#       | psql "<DIRECT_URL of an EMPTY database>"
#   Restore into a new, empty Neon project or branch — never over the live
#   one — then verify, then point the app at it. DISASTER-RECOVERY.md §2.
#
# ── Secrets it needs ────────────────────────────────────────────────────────
#
#   DIRECT_URL          already set for the deploy
#   BACKUP_PASSPHRASE   new: a long random string, kept in a password manager.
#                       Lose it and every artifact is noise.
# ============================================================================
name: Backup database

on:
  schedule:
    # 21:30 UTC = 03:00 in Colombo, the quietest hour for a restaurant.
    - cron: '30 21 * * *'
  workflow_dispatch: {}

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, verify, encrypt, keep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_IMAGE: postgres:18
    steps:
      - name: Refuse to run without the essentials
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::The DIRECT_URL secret is not set, so there is nothing to dump."; exit 1
          fi
          if [ -z "${BACKUP_PASSPHRASE:-}" ] || [ "${#BACKUP_PASSPHRASE}" -lt 24 ]; then
            echo "::error::BACKUP_PASSPHRASE is missing or shorter than 24 characters. This repository is public; an unencrypted dump will not be uploaded. Add the secret and re-run."; exit 1
          fi

      - name: Dump the database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          # The client must be at least the server's major version, or pg_dump
          # refuses. The image tracks the newest Postgres Neon offers.
          docker run --rm -e PGCONNECT_TIMEOUT=30 "$PG_IMAGE" \
            pg_dump --no-owner --no-privileges --format=plain "$DIRECT_URL" \
            | gzip -9 > "tableflow-$stamp.sql.gz"
          size=$(du -h "tableflow-$stamp.sql.gz" | cut -f1)
          echo "dump: tableflow-$stamp.sql.gz ($size)"
          # What the source says it holds, for the comparison below.
          docker run --rm -e PGCONNECT_TIMEOUT=30 "$PG_IMAGE" psql "$DIRECT_URL" -Atc \
            "select (select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'), (select count(*) from restaurants), (select count(*) from orders), (select count(*) from users)" \
            > source-counts.txt
          echo "source tables|restaurants|orders|users: $(cat source-counts.txt)"

      - name: Restore it somewhere disposable and count what came back
        run: |
          set -euo pipefail
          docker run -d --name restore -e POSTGRES_PASSWORD=restore "$PG_IMAGE" >/dev/null
          for i in $(seq 1 30); do
            docker exec restore pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          # Extensions such as pg_stat_statements exist on Neon and not here;
          # those statements may fail and are not what is being verified.
          gunzip -c "tableflow-$STAMP.sql.gz" \
            | docker exec -i restore psql -U postgres -d postgres -q -v ON_ERROR_STOP=0 2>restore-errors.log >/dev/null || true
          restored=$(docker exec restore psql -U postgres -d postgres -Atc \
            "select (select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'), (select count(*) from restaurants), (select count(*) from orders), (select count(*) from users)")
          echo "restored tables|restaurants|orders|users: $restored"
          echo "errors during restore (extensions are expected here):"; grep -v "^$" restore-errors.log | head -20 || true
          if [ "$restored" != "$(cat source-counts.txt)" ]; then
            echo "::error::The restored copy does not match the source. The dump is not trustworthy; investigate before tonight passes."
            exit 1
          fi
          echo "verified: the dump restores to the same tables and row counts as production"
          docker rm -f restore >/dev/null

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -salt \
            -pass env:BACKUP_PASSPHRASE \
            -in "tableflow-$STAMP.sql.gz" -out "tableflow-$STAMP.sql.gz.enc"
          rm -f "tableflow-$STAMP.sql.gz"
          # Prove the ciphertext opens with the same passphrase before keeping it.
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 \
            -pass env:BACKUP_PASSPHRASE -in "tableflow-$STAMP.sql.gz.enc" | gunzip | head -c 64 >/dev/null
          echo "encrypted: tableflow-$STAMP.sql.gz.enc ($(du -h "tableflow-$STAMP.sql.gz.enc" | cut -f1))"

      - name: Keep it for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: tableflow-db-${{ env.STAMP }}
          path: tableflow-${{ env.STAMP }}.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
