# ============================================================================
# Push to main → the server is running the new code about two minutes later.
#
# ── Why it builds here and not on the server ────────────────────────────────
#
# The obvious script is "ssh in, git pull, docker compose up --build". It works,
# and it is the wrong shape for this app: `next build` on 115k lines wants 2–4 GB
# of RAM and several minutes of CPU, and the box doing that work is the same box
# serving dinner service. On a 2 GB server the build competes with the running
# app for memory and can take the site down to deploy the site.
#
# So the image is built HERE, on GitHub's hardware, and pushed to the registry.
# The server pulls a finished image and restarts: seconds, no build, no memory
# spike, and a broken build never reaches production because it fails before
# anything is deployed.
#
# ── What it needs before it will run ────────────────────────────────────────
#
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#
#   SSH_HOST        the OVH server's IP
#   SSH_USER        the deploy user (not root). Must be in the `docker` group
#                   and must already have this repo cloned at
#                   ~/RestaurantBillingAppp, with deploy/ovh/.env filled in.
#   SSH_KEY         a PRIVATE key whose public half is in that user's
#                   ~/.ssh/authorized_keys. Generate a NEW key for this —
#                   never reuse a personal one:
#                     ssh-keygen -t ed25519 -f deploy_key -N ""
#
# ── This server is shared ───────────────────────────────────────────────────
#
# nginx on this box owns :80 and :443 for four other sites. The app therefore
# publishes on 127.0.0.1:3010 and nginx proxies to it; there is no Caddy
# container. See the header of deploy/ovh/docker-compose.yml.
#
# GITHUB_TOKEN is provided automatically; nothing to set for the registry.
# ============================================================================
name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch: {}        # ...and a "Run workflow" button, for redeploys

concurrency:
  # A second push while the first is deploying should win, not interleave.
  group: deploy-ovh
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # NOT ghcr.io/${{ github.repository }} — that is Manshaf-nnn/RestaurantBillingAppp,
  # and a registry rejects capitals outright ("repository name must be
  # lowercase"). The image name is lowercased in the `meta` step below, where
  # there is a shell to do it in; ${{ }} expressions have no such function.

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          # The commit sha, so a rollback is naming an older tag rather than
          # hoping "latest" still points where you think it does.
          echo "tag=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          # Registries reject capitals, and the repository name has three.
          echo "image=${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Stamped into the build so /api/health can say which commit is
          # serving — see the ARGs in the Dockerfile's builder stage.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Release it
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull the new image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true          # stop at the first failing command
          # The action's default is ten minutes, and on 2026-09-18 a deploy hit
          # it exactly: one image layer stalled mid-download, the pull sat there
          # printing the same progress line ten thousand times, and the step was
          # killed at 10m03s with the old version still serving.
          #
          # The retry in the script is what actually fixes a stalled pull. This
          # is the outer bound, raised so a slow-but-moving pull on a small box
          # is not mistaken for a hung one.
          command_timeout: 25m
          # The step's `env:` block below sets these on the RUNNER. This action
          # opens a fresh shell on the server, which inherits none of it, so
          # they have to be named here to be forwarded. Without this the script
          # dies on `set -u` with "GHCR_TOKEN: unbound variable".
          envs: GHCR_USER,GHCR_TOKEN,NEW_DATABASE_URL,NEW_DIRECT_URL,NEW_NEON_API_KEY,NEW_NEON_PROJECT_ID
          script: |
            set -euo pipefail

            # Whatever fails below, say what the disk looked like when it did.
            # Five deploys in a row failed in this step on 2026-09-17 and the
            # only thing the log carried up to GitHub was "exit code 1", which
            # is not a diagnosis. The trap costs nothing on a good run.
            trap 'echo "── DEPLOY FAILED. disk: $(df -h / | tail -1)"; docker system df 2>&1 || true' ERR

            cd ~/RestaurantBillingAppp

            # Disk FIRST. On 2026-09-16 three deploys in a row died at `git
            # fetch` with "No space left on device": every deploy pulls a new
            # image, and old tags were only ever pruned AFTER a successful
            # pull, so a server that filled up could never deploy its way
            # out. Prune what nothing runs before anything is written — the
            # serving container's image is in use and stays; a rollback
            # re-pulls its tag from GHCR anyway. `|| true`: a prune that finds
            # nothing must not stop the deploy.
            echo "disk before: $(df -h / | tail -1)"
            # No age filter, deliberately. `--filter until=72h` keeps every
            # image created in the last three days — which is exactly the
            # images the deploys themselves create, so on a day with several
            # deploys the cleanup could not reclaim the space the deploys were
            # consuming, and the box filled up with the tool that was supposed
            # to stop it running. Docker never removes an image a running
            # container uses, so the serving version survives this; every
            # older tag is still in GHCR and a rollback re-pulls it.
            docker image prune -af >/dev/null 2>&1 || true
            docker container prune -f >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null 2>&1 || true
            echo "disk after:  $(df -h / | tail -1)"
            docker system df 2>&1 || true

            # The compose file and Caddyfile are read from the repo, so a
            # change to either ships with the deploy.
            git fetch --all --quiet
            git reset --hard origin/main --quiet

            cd deploy/ovh
            export IMAGE_TAG="${{ needs.build.outputs.tag }}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Pull, and mean it.
            #
            # A single layer stalling is the failure that has actually happened
            # here: the download makes no progress, the pull never returns, and
            # the job dies on the command timeout with nothing deployed. Docker
            # does not retry a stalled layer on its own, so each attempt gets
            # its own wall clock and a fresh connection.
            #
            # `--quiet` because the progress ticker wrote ten thousand identical
            # lines into the last failed log, burying the one line that says
            # what went wrong.
            pulled=0
            for attempt in 1 2 3; do
              echo "pull attempt ${attempt}…"
              if timeout 300 docker compose pull --quiet app; then
                pulled=1
                break
              fi
              echo "pull attempt ${attempt} did not finish; retrying"
              sleep 5
            done
            if [ "$pulled" != "1" ]; then
              echo "The image could not be pulled after three attempts."
              echo "The running version is untouched; nothing was deployed."
              exit 1
            fi

            # ── The connection string, when the repository carries one ──────
            #
            # `deploy/ovh/.env` on this box is the source of truth for
            # DATABASE_URL, and that is fine until the day it has to change —
            # and on the day it seems to, nobody may have SSH to hand. This
            # was written on 2026-09-27 for exactly that situation.
            #
            # What that outage actually was, for the next person: NOT a
            # changed hostname. The Neon project serving production
            # (ep-weathered-band-azy9fnhg, on a free plan in a different Neon
            # organisation) had exhausted its monthly quota and Neon was
            # refusing every connection with "Your account or project has
            # exceeded the quota" — which Prisma reports as the unhelpful
            # P1001 "Can't reach database server". The endpoint, the password
            # and the data were all fine. Before rewriting a connection
            # string, run the "Diagnose database" workflow: it prints the raw
            # error from the box, and it would have said so.
            #
            # How it ended, the same evening: production moved to the paid
            # Neon project (ep-purple-mud-az41kemf, project "restaurantos"),
            # which was wiped of its July development tables, migrated from
            # empty and seeded with the platform admin. Every restaurant and
            # order from August–September is still in ep-weathered-band,
            # untouched — Neon does not delete data over quota — and is to be
            # copied across once that project can be read again (its quota
            # resets on the 1st, or it is transferred into the paid
            # organisation). Until then those restaurants do not exist here.
            #
            # So the repository may hold a DATABASE_URL secret. When it is
            # set, it is written here before anything tries to connect, which
            # makes rotating the credential a deploy rather than a shell
            # session. When it is unset — the ordinary case — nothing is
            # touched and the file on the box stays authoritative.
            #
            # Setting it is the one way a deploy can point production at the
            # WRONG database, so `db:deploy:safe` below is the backstop: it
            # refuses a database whose tables do not match the migration
            # history rather than baselining it. That refusal is what stopped
            # the 2026-09-27 secret — which at that hour still named the
            # untouched July development tables — from becoming production
            # by accident, before it became production on purpose.
            # Already in deploy/ovh — the script cd'd there before pulling.
            #
            # BOTH urls, because Prisma uses two. `DATABASE_URL` is the pooled
            # endpoint the app serves from; `DIRECT_URL` is the unpooled one it
            # MIGRATES over, because a migration cannot run through a pooler.
            # They differ only by `-pooler` in the hostname, they go stale
            # together, and updating only the first is a deploy that gets
            # further and still fails — which is exactly what happened on the
            # first attempt at this fix.
            #
            # And when the synced string is REFUSED — by Neon, or by the schema
            # check below — the file goes back to what it was. Three deploys
            # on 2026-09-27 wrote a wrong secret into .env, failed at the
            # migration step, and left it there: the live container kept the
            # old value only because it had already been created, and the
            # first hand-run `docker compose up -d` would have pointed the
            # site at the wrong database. A refused secret must leave no
            # trace on the box.
            #
            # NEON_API_KEY and NEON_PROJECT_ID ride the same way (added
            # 2026-09-28): they are what the console's Neon section and the
            # backups page read when nothing has been saved in the console,
            # so a fresh box watches its database from the first deploy.
            synced=0
            backup=""
            if [ -n "${NEW_DATABASE_URL:-}${NEW_DIRECT_URL:-}${NEW_NEON_API_KEY:-}${NEW_NEON_PROJECT_ID:-}" ]; then
              # Kept, timestamped, before any rewrite: a bad value here takes
              # the site down, and the previous one is what you want back.
              backup=".env.bak.$(date +%Y%m%d%H%M%S)"
              cp .env "$backup"
              synced=1
              cp .env .env.next
              sync_var() {
                # $1 = name in .env, $2 = value; empty value leaves the file alone.
                [ -n "$2" ] || return 0
                grep -v "^$1=" .env.next > .env.tmp || true
                printf '%s=%s\n' "$1" "$2" >> .env.tmp
                mv .env.tmp .env.next
                echo "$1 synced from the repository secret"
              }
              sync_var DATABASE_URL "${NEW_DATABASE_URL:-}"
              sync_var DIRECT_URL "${NEW_DIRECT_URL:-}"
              sync_var NEON_API_KEY "${NEW_NEON_API_KEY:-}"
              sync_var NEON_PROJECT_ID "${NEW_NEON_PROJECT_ID:-}"
              mv .env.next .env
              chmod 600 .env
            fi

            # Migrations run BEFORE the new container takes traffic, in a
            # throwaway container on the new image. If this fails the deploy
            # stops here and the old version keeps serving — and a connection
            # string this deploy wrote is taken back out, so the box is left
            # exactly as it was found.
            if ! docker compose run --rm app npm run db:deploy:safe; then
              if [ "$synced" = "1" ]; then
                cp "$backup" .env && chmod 600 .env
                echo "The synced DATABASE_URL/DIRECT_URL were refused; .env restored from $backup."
                echo "Fix the repository secrets (or delete them) before deploying again."
              fi
              echo "Migrations did not apply. The running version is untouched; nothing was deployed."
              exit 1
            fi

            docker compose up -d
            docker image prune -f --filter "until=168h"

            # Health is checked HERE, on the server, over loopback. The public
            # URL is not a reliable signal: until DNS cutover it still answers
            # from the old host, so a green check there could mean the new
            # container never started.
            echo "waiting for the container to report healthy…"
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
                "http://127.0.0.1:3010/api/health" || true)
              if [ "$code" = "200" ]; then
                echo "healthy after ${i} attempt(s)"
                curl -s http://127.0.0.1:3010/api/health | head -c 300; echo
                exit 0
              fi
              echo "attempt $i: $code"; sleep 5
            done
            echo "The app did not come back healthy. Recent logs:"
            docker compose logs --tail 60 app
            exit 1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Set the DATABASE_URL repository secret and the next
          # deploy rewrites the server's .env to match — see the step below.
          NEW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Prisma migrates over a DIRECT connection, never the pooler, so the
          # two are separate settings and BOTH go stale together.
          NEW_DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # Optional too. The console's Neon section and /admin/backups read
          # these when nothing has been saved in the console.
          NEW_NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEW_NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

      - name: Check the public URL, once DNS points here
        # Only meaningful after cutover. Skipped — not failed — while
        # tableflow.markui.lk still resolves somewhere else, so the deploy is
        # not held hostage to a DNS change that has not happened yet.
        run: |
          resolved=$(getent hosts tableflow.markui.lk | awk '{print $1}' | head -1)
          if [ "$resolved" != "${{ secrets.SSH_HOST }}" ]; then
            echo "tableflow.markui.lk resolves to ${resolved:-nothing}, not this server."
            echo "Skipping the public check — the server-side check above is authoritative."
            exit 0
          fi
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://tableflow.markui.lk/api/health" || true)
            if [ "$code" = "200" ]; then echo "publicly healthy"; exit 0; fi
            echo "attempt $i: $code"; sleep 10
          done
          echo "The site did not come back healthy — check the server."
          exit 1
