# ============================================================================
# Push to main → the server is running the new code about two minutes later.
#
# ── Why it builds here and not on the server ────────────────────────────────
#
# The obvious script is "ssh in, git pull, docker compose up --build". It works,
# and it is the wrong shape for this app: `next build` on 115k lines wants 2–4 GB
# of RAM and several minutes of CPU, and the box doing that work is the same box
# serving dinner service. On a 2 GB server the build competes with the running
# app for memory and can take the site down to deploy the site.
#
# So the image is built HERE, on GitHub's hardware, and pushed to the registry.
# The server pulls a finished image and restarts: seconds, no build, no memory
# spike, and a broken build never reaches production because it fails before
# anything is deployed.
#
# ── What it needs before it will run ────────────────────────────────────────
#
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#
#   SSH_HOST        the OVH server's IP
#   SSH_USER        the deploy user (not root). Must be in the `docker` group
#                   and must already have this repo cloned at
#                   ~/RestaurantBillingAppp, with deploy/ovh/.env filled in.
#   SSH_KEY         a PRIVATE key whose public half is in that user's
#                   ~/.ssh/authorized_keys. Generate a NEW key for this —
#                   never reuse a personal one:
#                     ssh-keygen -t ed25519 -f deploy_key -N ""
#
# ── This server is shared ───────────────────────────────────────────────────
#
# nginx on this box owns :80 and :443 for four other sites. The app therefore
# publishes on 127.0.0.1:3010 and nginx proxies to it; there is no Caddy
# container. See the header of deploy/ovh/docker-compose.yml.
#
# GITHUB_TOKEN is provided automatically; nothing to set for the registry.
# ============================================================================
name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch: {}        # ...and a "Run workflow" button, for redeploys

concurrency:
  # A second push while the first is deploying should win, not interleave.
  group: deploy-ovh
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # NOT ghcr.io/${{ github.repository }} — that is Manshaf-nnn/RestaurantBillingAppp,
  # and a registry rejects capitals outright ("repository name must be
  # lowercase"). The image name is lowercased in the `meta` step below, where
  # there is a shell to do it in; ${{ }} expressions have no such function.

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          # The commit sha, so a rollback is naming an older tag rather than
          # hoping "latest" still points where you think it does.
          echo "tag=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          # Registries reject capitals, and the repository name has three.
          echo "image=${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Stamped into the build so /api/health can say which commit is
          # serving — see the ARGs in the Dockerfile's builder stage.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Release it
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull the new image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true          # stop at the first failing command
          # The step's `env:` block below sets these on the RUNNER. This action
          # opens a fresh shell on the server, which inherits none of it, so
          # they have to be named here to be forwarded. Without this the script
          # dies on `set -u` with "GHCR_TOKEN: unbound variable".
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ~/RestaurantBillingAppp

            # The compose file and Caddyfile are read from the repo, so a
            # change to either ships with the deploy.
            git fetch --all --quiet
            git reset --hard origin/main --quiet

            cd deploy/ovh
            export IMAGE_TAG="${{ needs.build.outputs.tag }}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app

            # Migrations run BEFORE the new container takes traffic, in a
            # throwaway container on the new image. If this fails the deploy
            # stops here and the old version keeps serving.
            docker compose run --rm app npm run db:deploy:safe

            docker compose up -d
            docker image prune -f --filter "until=168h"

            # Health is checked HERE, on the server, over loopback. The public
            # URL is not a reliable signal: until DNS cutover it still answers
            # from the old host, so a green check there could mean the new
            # container never started.
            echo "waiting for the container to report healthy…"
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
                "http://127.0.0.1:3010/api/health" || true)
              if [ "$code" = "200" ]; then
                echo "healthy after ${i} attempt(s)"
                curl -s http://127.0.0.1:3010/api/health | head -c 300; echo
                exit 0
              fi
              echo "attempt $i: $code"; sleep 5
            done
            echo "The app did not come back healthy. Recent logs:"
            docker compose logs --tail 60 app
            exit 1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the public URL, once DNS points here
        # Only meaningful after cutover. Skipped — not failed — while
        # tableflow.markui.lk still resolves somewhere else, so the deploy is
        # not held hostage to a DNS change that has not happened yet.
        run: |
          resolved=$(getent hosts tableflow.markui.lk | awk '{print $1}' | head -1)
          if [ "$resolved" != "${{ secrets.SSH_HOST }}" ]; then
            echo "tableflow.markui.lk resolves to ${resolved:-nothing}, not this server."
            echo "Skipping the public check — the server-side check above is authoritative."
            exit 0
          fi
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://tableflow.markui.lk/api/health" || true)
            if [ "$code" = "200" ]; then echo "publicly healthy"; exit 0; fi
            echo "attempt $i: $code"; sleep 10
          done
          echo "The site did not come back healthy — check the server."
          exit 1
