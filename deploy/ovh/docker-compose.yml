# ============================================================================
# TableFlow on the OVH server — the app and its job ticker, nothing else.
#
#   docker compose up -d
#
# There is deliberately NO database here. The data lives in Neon and this box
# only runs code: that is what makes a bad deploy survivable — you rebuild the
# container, and every order, payment and photo is exactly where it was.
# (docker-compose.yml in the repo root is the LOCAL stack, with its own
# Postgres, for development. Do not use that one here.)
#
# ── Why there is no TLS terminator here ─────────────────────────────────────
#
# This box is not ours alone. nginx already owns :80 and :443 and serves four
# other sites (yova.markui.lk, travel-basic, travel-premium, vikkaa.lk). A Caddy
# container publishing those ports cannot start while nginx holds them, and the
# only way to "fix" that is to stop nginx — which takes all four sites down.
#
# So the app publishes on 127.0.0.1:3010 and the existing nginx proxies to it.
# The vhost is deploy/nginx/tableflow.markui.lk.conf; certificates come from the
# certbot that already renews the other four.
#
# deploy/ovh/Caddyfile is kept for the dedicated-box case — it does on-demand
# TLS for restaurant custom domains, which nginx cannot do. It is NOT used here.
# See the note at the bottom of the nginx vhost for the manual equivalent.
# ============================================================================
services:
  app:
    # Built by GitHub Actions and pulled ready-made — see
    # .github/workflows/deploy-ovh.yml for why the server does not build its
    # own image. IMAGE_TAG is set by the deploy; `latest` is the fallback for
    # a hand-run `docker compose up -d`.
    image: ghcr.io/manshaf-nnn/restaurantbillingappp:${IMAGE_TAG:-latest}
    # To build on the server instead — no registry, no Actions — comment the
    # image line above and uncomment these three. Expect 5–15 minutes and
    # 2 GB+ of RAM for each deploy, on a box that has ~2 GB free and four other
    # apps competing for it. That is the situation the CI build exists to avoid.
    # build:
    #   context: ../..
    #   dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # MUST be set explicitly. server.mjs binds `process.env.HOSTNAME ||
      # "0.0.0.0"`, and Docker sets HOSTNAME by itself to the container's
      # hostname — which resolves to the container IP (172.18.x.x). The app
      # then listens ONLY on that address, so localhost inside the container is
      # refused and the HEALTHCHECK below fails forever, while the app looks
      # fine from outside because the port mapping targets the container IP.
      # A permanently "unhealthy" container is worse than none: it hides the
      # real thing when it happens, and blocks any depends_on: service_healthy.
      HOSTNAME: "0.0.0.0"
    # Loopback ONLY. Publishing 3010 without the 127.0.0.1 prefix would put the
    # app straight onto both public IPs, and Docker writes its own iptables
    # rules — ufw would not stop it.
    ports:
      - "127.0.0.1:3010:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    # The box has 3.7 GB shared with four other apps. Without a ceiling a leak
    # here gets resolved by the kernel picking a victim, which may not be us.
    deploy:
      resources:
        limits:
          memory: 1200M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The work that belongs to nobody's request: integrity sweeps, retention
  # trimming. Netlify ran this as a scheduled function every 15 minutes.
  # Reaches the app over the compose network, so it does not care about the
  # host port above.
  jobs:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    command: >-
      sh -c "apk add --no-cache curl >/dev/null &&
      while true; do
        sleep 900;
        curl -fsS -X POST
          -H 'content-type: application/json'
          -H \"authorization: Bearer $$JOBS_SECRET\"
          -d '{\"source\":\"ovh-loop\"}'
          http://app:3000/api/jobs/run || echo '[jobs] call failed';
      done"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
