# ============================================================================
# nginx vhost for TableFlow — tableflow.markui.lk
# ----------------------------------------------------------------------------
# This box serves other sites. Everything here is additive: an exact
# server_name, no default_server, no edits to any shared file.
#
# Install:
#   cp deploy/nginx/tableflow.markui.lk.conf /etc/nginx/sites-available/
#   cp deploy/nginx/tableflow-map.conf /etc/nginx/conf.d/    # see note below
#   mkdir -p /var/www/letsencrypt
#   cp -a /etc/nginx /root/nginx-backup-$(date +%F-%H%M)     # rollback point
#
# Bring it up in two passes so a mistake never reaches a running nginx:
#   1. Comment out the entire :443 block, then
#        ln -s /etc/nginx/sites-available/tableflow.markui.lk.conf \
#              /etc/nginx/sites-enabled/
#        nginx -t && systemctl reload nginx     # reload, NEVER restart
#   2. Run certbot (below), uncomment :443, then
#        nginx -t && systemctl reload nginx
#
# If `nginx -t` fails, remove the symlink and re-test — the running nginx never
# picked up the broken config and the other sites are untouched.
#
# Certificate:
#   certbot certonly --webroot -w /var/www/letsencrypt -d tableflow.markui.lk \
#     --email admin@markui.lk --agree-tos --no-eff-email
#
# Do NOT use `certbot --nginx`: that plugin rewrites this file.
# Do NOT delete /etc/nginx/sites-enabled/default — it may be another site's
# catch-all, whatever DEPLOYMENT.md says.
# ============================================================================

# ── Redirect to HTTPS, and serve ACME challenges ────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tableflow.markui.lk;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── The app ─────────────────────────────────────────────────────────────────
server {
    # The target VPS runs nginx 1.24.0, which predates the `http2 on;`
    # directive (1.25.1+). Keep http2 on the listen line here. On nginx >= 1.25.1
    # the modern form is `listen 443 ssl;` plus a separate `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Exact hostname, and deliberately not default_server: an unmatched host
    # must keep landing wherever it lands today.
    server_name tableflow.markui.lk;

    ssl_certificate     /etc/letsencrypt/live/tableflow.markui.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tableflow.markui.lk/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # src/app/api/uploads/route.ts accepts up to 5 MB. nginx defaults to 1m,
    # which turns a large menu photo into a bare nginx 413 the app never sees.
    client_max_body_size 8m;

    access_log /var/log/nginx/tableflow.access.log;
    error_log  /var/log/nginx/tableflow.error.log;

    # No add_header here on purpose. next.config.mjs already sends CSP, HSTS,
    # X-Frame-Options and the rest; adding them here would not replace those.

    # ── Socket.IO ───────────────────────────────────────────────────────────
    # Split out from `location /` only for the long read timeout: server.mjs
    # uses pingInterval 25s / pingTimeout 20s, and a proxy timeout below those
    # shows up as kitchen screens silently reconnecting every minute.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $tableflow_conn_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE, never $proxy_add_x_forwarded_for. rate-limit.ts reads the
        # FIRST entry of X-Forwarded-For, and appending would let a client send
        # its own value and get a fresh rate-limit bucket on every request.
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Everything else ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $tableflow_conn_upgrade;
        proxy_set_header Host              $host;
        # requestHost() in src/server/db/tenant.ts reads x-forwarded-host first
        # to pick the tenant, and requestOrigin() in src/lib/tenant-url.ts
        # builds every printed QR and receipt URL from it plus the proto. Get
        # the proto wrong and every printed link says http://.
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_cache_bypass $http_upgrade;
        # Next streams RSC payloads; buffering them delays first paint.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# ============================================================================
# Adding a tenant subdomain or a restaurant's own domain
# ----------------------------------------------------------------------------
# There is no wildcard certificate here on purpose: a *.markui.lk cert needs
# DNS-01, which needs an API token that can edit every record in the zone —
# including the other sites'. Per-domain certs cost one command and cannot
# shadow anything. (Let's Encrypt allows 50 certs per registered domain/week.)
#
#   certbot certonly --webroot -w /var/www/letsencrypt -d <host> --cert-name <host>
#   # copy the :443 block above, swap server_name and the two cert paths
#   nginx -t && systemctl reload nginx
#
# ORDER MATTERS, and it is the reverse of the Caddy setup in deploy/ovh/:
#   1. the restaurant points DNS at this server
#   2. wait for propagation  (dig +short <host>)
#   3. run certbot and add the vhost          ← must happen BEFORE step 4
#   4. set the domain in /admin and press Verify
# verifyCustomDomain() fetches https://<host>/api/public/whoami, so without a
# certificate already in place Verify fails with "could not be reached".
# ============================================================================
