# ============================================================================
# WebSocket upgrade map for TableFlow.  →  /etc/nginx/conf.d/tableflow-map.conf
# ----------------------------------------------------------------------------
# Sends `Connection: upgrade` only on requests that actually asked to upgrade,
# and `Connection: close` otherwise. Hardcoding `Connection: upgrade` on every
# request (as deploy/nginx.conf.example did) breaks keepalive on plain HTTP.
#
# ⚠ BEFORE INSTALLING THIS FILE, check whether the box already defines a map on
# $http_upgrade — another site very likely does:
#
#     grep -rn 'map \$http_upgrade' /etc/nginx/
#
# A duplicate map makes nginx refuse to start, which takes down EVERY site on
# the box. If one already exists, do not install this file: use their variable
# name in tableflow.markui.lk.conf instead.
#
# conf.d/*.conf is included by the stock nginx.conf, so no shared file is edited.
# The variable name is deliberately unusual to avoid colliding with the common
# $connection_upgrade.
# ============================================================================
map $http_upgrade $tableflow_conn_upgrade {
    default upgrade;
    ''      close;
}
